name: Deploy site

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT stored as a repo secret. The default GITHUB_TOKEN
      # cannot read Projects (v2) data. Needs, on django/new-features:
      # repository permission "Issues: Read-only", plus org permission
      # "Projects: Read-only" (django org must allow/approve fine-grained
      # PAT access). See README.md.
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync

      - name: Get UTC date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # output/ (gitignored) holds the raw fetch results, cached per UTC
      # day. Every run on a given day (schedule, push, or manual) hits the
      # same key and reuses whatever was fetched earlier that day; the
      # first run of a new day misses and triggers a fresh fetch. PR runs
      # fall back to the most recent available cache (restore-keys) and
      # never fetch or write to the cache themselves: PROJECTS_TOKEN isn't
      # available to PRs from forks, and re-fetching on every PR would
      # multiply API usage for no benefit over reusing today's/yesterday's
      # data.
      - name: Restore cached issue data
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: output
          key: issue-data-${{ steps.date.outputs.date }}
          restore-keys: |
            issue-data-

      - name: Fetch reactions
        if: steps.cache-restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: uv run python scripts/fetch_reactions.py --repo django/new-features -v

      - name: Fetch issue details (labels, comments, project status)
        if: steps.cache-restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: uv run python scripts/fetch_issue_details.py --repo django/new-features --project-number 24 -v

      - name: Save issue data cache
        if: steps.cache-restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: output
          key: issue-data-${{ steps.date.outputs.date }}

      - name: Build site data
        run: uv run python scripts/build_site_data.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site deps
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Install Playwright browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run site tests
        working-directory: site
        run: npm test

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
